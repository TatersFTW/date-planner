<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Date planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8C%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400..700&display=swap">
<style>
:root{
  --bg:#F3F0F8;--card:#FFFFFF;--field:#FBFAFD;--ink:#241A35;--muted:#655A78;--line:#D8CFE5;
  --accent:#C2185B;--on-accent:#FFFFFF;
  --yes:#127A5A;--maybe:#8A5A00;--no:#5F566F;--on-sel:#FFFFFF;
  color-scheme:light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#150F1E;--card:#211929;--field:#1A1323;--ink:#F1EBF8;--muted:#B0A3C4;--line:#3A2E4B;
    --accent:#FF6B9A;--on-accent:#2A0716;
    --yes:#4BD8A6;--maybe:#F2C14E;--no:#B0A3C4;--on-sel:#141019;
  }
}
:root[data-theme="dark"]{
  --bg:#150F1E;--card:#211929;--field:#1A1323;--ink:#F1EBF8;--muted:#B0A3C4;--line:#3A2E4B;
  --accent:#FF6B9A;--on-accent:#2A0716;
  --yes:#4BD8A6;--maybe:#F2C14E;--no:#B0A3C4;--on-sel:#141019;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
.wrap.owner{padding-bottom:130px}

/* owner top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 14px;margin-bottom:22px}
.hint{font-size:.9rem;color:var(--muted)}
.seg{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.seg button{min-height:40px;padding:0 18px;border:0;border-radius:999px;background:none;color:var(--muted);font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.previewnote{margin:-8px 0 18px;padding:10px 14px;border-radius:12px;background:var(--card);border:1px dashed var(--line);font-size:.92rem;color:var(--muted)}

/* hero */
.hero{margin-bottom:26px}
.hi{margin:0 0 4px;color:var(--muted);font-size:1.05rem}
h1,h2,.what,.stub{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif}
h1{margin:0 0 12px;font-weight:800;font-size:clamp(2.1rem,10vw,3rem);line-height:1.02;letter-spacing:-.025em;text-wrap:balance;overflow-wrap:anywhere}
.note{margin:0;max-width:46ch;font-size:1.08rem;white-space:pre-line;overflow-wrap:anywhere}
h2{margin:0 0 6px;font-weight:700;font-size:1.45rem;line-height:1.15;letter-spacing:-.015em}
.help{margin:0 0 16px;color:var(--muted)}

/* ticket */
.list{display:grid;gap:16px;margin:0;padding:0;list-style:none}
.ticket{position:relative;display:grid;grid-template-columns:92px minmax(0,1fr);background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.stub{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 6px;text-align:center;background:var(--accent);color:var(--on-accent);border-right:2px dashed var(--bg)}
.stub::before,.stub::after{content:"";position:absolute;right:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1px solid var(--line);z-index:1}
.stub::before{top:-9px}
.stub::after{bottom:-9px}
.stub .dow,.stub .mon{font-size:.95rem;font-weight:600;line-height:1.2}
.stub .day{font-size:2.9rem;font-weight:800;line-height:1;letter-spacing:-.03em;margin:2px 0}
.tbody{padding:14px 14px 14px 18px;min-width:0}
.what{margin:0;font-weight:700;font-size:1.2rem;line-height:1.2;letter-spacing:-.01em;overflow-wrap:anywhere}
.meta{margin:4px 0 0;color:var(--muted);font-size:.96rem;overflow-wrap:anywhere}
.ticket.big{grid-template-columns:112px minmax(0,1fr)}
.ticket.big .stub .day{font-size:3.7rem}
.ticket.big .what{font-size:1.55rem}
.ticket.big .meta{font-size:1.05rem}
.ticket.locked{border-color:var(--accent);border-width:2px}

.answers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:12px}
.ans{min-height:42px;padding:0 4px;border:1.5px solid var(--line);border-radius:12px;background:transparent;font-weight:600;font-size:.9rem;cursor:pointer;transition:background-color .15s,color .15s,border-color .15s}
.ans:hover{border-color:var(--muted)}
.ans.on{color:var(--on-sel)}
.ans.on::before{content:"\2713\00a0"}
.ans.on.ans-in{background:var(--yes);border-color:var(--yes)}
.ans.on.ans-maybe{background:var(--maybe);border-color:var(--maybe)}
.ans.on.ans-no{background:var(--no);border-color:var(--no)}

/* reply */
.reply{margin-top:30px;padding-top:24px;border-top:1px solid var(--line)}
.preview{margin:12px 0;padding:14px;border:1px dashed var(--line);border-radius:14px;background:var(--field);white-space:pre-wrap;overflow-wrap:anywhere;font-size:.96rem;user-select:text;-webkit-user-select:text}
.preview.empty{color:var(--muted)}
.cta{margin:22px 0 0}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border:1.5px solid var(--ink);border-radius:999px;background:transparent;color:var(--ink);font-weight:700;text-decoration:none;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:40px;padding:0 16px;font-size:.92rem}
.btn.add{width:100%;margin-top:16px;border-style:dashed;border-color:var(--muted);color:var(--muted)}
.btn.add:hover{color:var(--ink);border-color:var(--ink)}
.btn.quiet{border-color:var(--line);color:var(--muted)}

/* forms */
.field{display:grid;gap:4px;margin:0 0 14px}
.field>span{font-size:.88rem;font-weight:600;color:var(--muted)}
input[type="text"],input[type="date"],input[type="time"],textarea{width:100%;min-height:46px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink);font-size:16px}
textarea{resize:vertical;min-height:78px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
.setup{margin-bottom:26px}
.edit .tbody{display:grid;gap:10px}
.edit .field{margin:0}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tactions{display:flex;flex-wrap:wrap;gap:8px}
.lockednote{margin:0 0 16px;padding:12px 14px;border-radius:14px;border:1px solid var(--accent);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.lockednote p{margin:0;overflow-wrap:anywhere}

.empty-card{padding:26px 20px;border:2px dashed var(--line);border-radius:18px;text-align:center;color:var(--muted)}

.savebar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);z-index:5}
.savestat{margin:0;font-size:.9rem;color:var(--muted)}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:90vw;padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
#toast.show{opacity:1}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  "use strict";

  var DEFAULT = { to: "", headline: "Free for a date soon?", note: "", options: [], confirmed: null };
  var state = JSON.parse(JSON.stringify(DEFAULT));
  var root = document.getElementById("root");
  var isOwner = false;
  var mode = "view";
  var pendingFocus = null;
  var replies = {};
  var message = "";

  try {
    var saved = JSON.parse(localStorage.getItem("dp-replies") || "{}");
    replies = saved.r || {};
    message = saved.m || "";
  } catch (e) {}

  function persist() {
    try { localStorage.setItem("dp-replies", JSON.stringify({ r: replies, m: message })); } catch (e) {}
  }

  /* ---------- plan <-> link ---------- */
  function toB64(s) {
    return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function fromB64(t) {
    t = t.replace(/-/g, "+").replace(/_/g, "/");
    while (t.length % 4) t += "=";
    return decodeURIComponent(escape(atob(t)));
  }
  function encodePlan(s) {
    return toB64(JSON.stringify([s.to, s.headline, s.note, s.confirmed || "",
      s.options.map(function (o) { return [o.id, o.date, o.time, o.title, o.place]; })]));
  }
  function decodePlan(t) {
    var a = JSON.parse(fromB64(t));
    var str = function (v) { return typeof v === "string" ? v : ""; };
    return {
      to: str(a[0]), headline: str(a[1]) || DEFAULT.headline, note: str(a[2]), confirmed: str(a[3]) || null,
      options: (Array.isArray(a[4]) ? a[4] : []).map(function (r) {
        return { id: str(r[0]) || uid(), date: str(r[1]), time: str(r[2]), title: str(r[3]), place: str(r[4]) };
      })
    };
  }
  function planFromHash() {
    var m = /^#d=([\w-]+)$/.exec(location.hash);
    if (!m) return null;
    try { return decodePlan(m[1]); } catch (e) { return null; }
  }
  function loadDraft() {
    try {
      var d = JSON.parse(localStorage.getItem("dp-draft") || "null");
      if (d && Array.isArray(d.options)) return d;
    } catch (e) {}
    return null;
  }
  function saveDraft() {
    try { localStorage.setItem("dp-draft", JSON.stringify(state)); } catch (e) {}
  }

  /* ---------- helpers ---------- */
  function el(tag, props, kids) {
    var n = document.createElement(tag);
    if (props) {
      for (var k in props) {
        var v = props[k];
        if (v == null || v === false) continue;
        if (k === "class") n.className = v;
        else if (k === "text") n.textContent = v;
        else if (k === "value") n.value = v;
        else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), v);
        else n.setAttribute(k, v === true ? "" : v);
      }
    }
    (kids || []).forEach(function (c) {
      if (c == null || c === false) return;
      n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return n;
  }

  function uid() { return Math.random().toString(36).slice(2, 8); }
  function pad(n) { return String(n).padStart(2, "0"); }
  function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }

  function parseDate(d, t) {
    if (!d) return null;
    var p = d.split("-").map(Number);
    if (p.length !== 3 || isNaN(p[0])) return null;
    var tt = (t || "").split(":").map(Number);
    return new Date(p[0], p[1] - 1, p[2], isNaN(tt[0]) ? 0 : tt[0], isNaN(tt[1]) ? 0 : tt[1]);
  }

  function fmtTime(t) {
    if (!t) return "";
    var p = t.split(":");
    var h = +p[0];
    var ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    return h + ":" + (p[1] || "00") + " " + ap;
  }

  function sorted() {
    return state.options.slice().sort(function (a, b) {
      return ((a.date || "9999") + " " + (a.time || "")).localeCompare((b.date || "9999") + " " + (b.time || ""));
    });
  }

  function nextSaturday() {
    var d = new Date();
    d.setDate(d.getDate() + ((6 - d.getDay() + 7) % 7 || 7));
    return d;
  }

  function untilText(o) {
    var d = parseDate(o.date);
    if (!d) return "";
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var diff = Math.round((d - today) / 86400000);
    if (diff === 0) return "today";
    if (diff === 1) return "tomorrow";
    if (diff > 1) return "in " + diff + " days";
    return "";
  }

  function calUrl(o) {
    var s = parseDate(o.date, o.time || "19:00");
    if (!s) return null;
    var e = new Date(s.getTime() + 2 * 3600 * 1000);
    function f(d) {
      return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "T" + pad(d.getHours()) + pad(d.getMinutes()) + "00";
    }
    return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(o.title || "Date") +
      "&dates=" + f(s) + "/" + f(e) + (o.place ? "&location=" + encodeURIComponent(o.place) : "");
  }

  var toastTimer = null;
  var toastEl = el("div", { id: "toast", role: "status", "aria-live": "polite" });
  document.body.appendChild(toastEl);
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 3200);
  }

  function copyText(text) {
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      return ok ? Promise.resolve() : Promise.reject(new Error("copy failed"));
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(fallback);
    }
    return fallback();
  }

  /* ---------- reply text (guest side) ---------- */
  function replyText() {
    var lines = [];
    sorted().forEach(function (o) {
      var a = replies[o.id];
      if (!a) return;
      var d = parseDate(o.date, o.time);
      var when = d
        ? d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }) + (o.time ? " at " + fmtTime(o.time) : "")
        : "";
      var mark = a === "in" ? "\u2705 I'm in" : a === "maybe" ? "\uD83E\uDD14 Maybe" : "\u274C Can't make it";
      lines.push((o.title || "Date idea") + (when ? ", " + when : "") + ": " + mark);
    });
    if (!lines.length) return "";
    var out = "About our date plans \uD83D\uDC8C\n" + lines.join("\n");
    if (message.trim()) out += "\n\n" + message.trim();
    return out;
  }

  function updateReply() {
    var t = replyText();
    var p = document.getElementById("rp");
    var b = document.getElementById("cpbtn");
    var s = document.getElementById("shbtn");
    if (p) {
      p.textContent = t || "Your reply will show up here once you answer at least one idea.";
      p.classList.toggle("empty", !t);
    }
    if (b) b.disabled = !t;
    if (s) s.disabled = !t;
  }

  /* ---------- tickets ---------- */
  function stub(o) {
    var d = parseDate(o.date);
    return el("div", { class: "stub" }, [
      el("span", { class: "dow", text: d ? d.toLocaleDateString(undefined, { weekday: "short" }) : "Date" }),
      el("span", { class: "day", text: d ? String(d.getDate()) : "?" }),
      el("span", { class: "mon", text: d ? d.toLocaleDateString(undefined, { month: "short" }) : "not set" })
    ]);
  }

  var ANS = [["in", "I'm in"], ["maybe", "Maybe"], ["no", "Can't"]];

  function answers(o) {
    return el("div", { class: "answers", role: "group", "aria-label": "Your answer for " + (o.title || "this idea") },
      ANS.map(function (a) {
        var on = replies[o.id] === a[0];
        return el("button", {
          type: "button",
          class: "ans ans-" + a[0] + (on ? " on" : ""),
          "aria-pressed": String(on),
          "data-fk": "a-" + o.id + "-" + a[0],
          text: a[1],
          onclick: function () {
            if (replies[o.id] === a[0]) delete replies[o.id]; else replies[o.id] = a[0];
            persist();
            render();
          }
        });
      }));
  }

  function ticket(o, big) {
    var d = parseDate(o.date);
    var t = fmtTime(o.time);
    var lines = [];
    if (t) lines.push(el("p", { class: "meta", text: t }));
    if (o.place) lines.push(el("p", { class: "meta", text: o.place }));
    return el("article", { class: "ticket" + (big ? " big" : "") }, [
      stub(o),
      el("div", { class: "tbody" }, [el("h3", { class: "what", text: o.title || "Date idea" })].concat(lines, big ? [] : [answers(o)]))
    ]);
  }

  function editTicket(o) {
    var isLocked = state.confirmed === o.id;
    return el("article", { class: "ticket edit" + (isLocked ? " locked" : "") }, [
      stub(o),
      el("div", { class: "tbody" }, [
        el("label", { class: "field" }, [
          el("span", { text: "What are you doing?" }),
          el("input", { type: "text", value: o.title, maxlength: "80", placeholder: "Dinner and a movie", "data-fk": "f-" + o.id + "-title",
            oninput: function () { o.title = this.value; markDirty(); } })
        ]),
        el("div", { class: "row2" }, [
          el("label", { class: "field" }, [
            el("span", { text: "Date" }),
            el("input", { type: "date", value: o.date, "data-fk": "f-" + o.id + "-date",
              onchange: function () { o.date = this.value; markDirty(); render(); } })
          ]),
          el("label", { class: "field" }, [
            el("span", { text: "Time" }),
            el("input", { type: "time", value: o.time, "data-fk": "f-" + o.id + "-time",
              onchange: function () { o.time = this.value; markDirty(); render(); } })
          ])
        ]),
        el("label", { class: "field" }, [
          el("span", { text: "Where (optional)" }),
          el("input", { type: "text", value: o.place, maxlength: "100", placeholder: "Our favorite ramen spot", "data-fk": "f-" + o.id + "-place",
            oninput: function () { o.place = this.value; markDirty(); } })
        ]),
        el("div", { class: "tactions" }, [
          el("button", { type: "button", class: "btn small" + (isLocked ? " quiet" : ""), "data-fk": "l-" + o.id,
            text: isLocked ? "Unlock" : "Lock this one in",
            onclick: function () { state.confirmed = isLocked ? null : o.id; markDirty(); render(); } }),
          el("button", { type: "button", class: "btn small quiet", "data-fk": "r-" + o.id, text: "Remove",
            onclick: function () {
              state.options = state.options.filter(function (x) { return x.id !== o.id; });
              if (state.confirmed === o.id) state.confirmed = null;
              markDirty();
              render();
            } })
        ])
      ])
    ]);
  }

  /* ---------- views ---------- */
  function hero() {
    return el("header", { class: "hero" }, [
      state.to ? el("p", { class: "hi", text: "Hi " + state.to + "," }) : null,
      el("h1", { text: state.headline || "Free for a date soon?" }),
      state.note ? el("p", { class: "note", text: state.note }) : null
    ]);
  }

  function replyPanel() {
    var ta = el("textarea", {
      id: "msg", rows: "2", placeholder: "Anything else you want to say? (optional)", "aria-label": "Extra message",
      oninput: function () { message = this.value; persist(); updateReply(); }
    });
    ta.value = message;
    var btns = [
      el("button", { type: "button", id: "cpbtn", class: "btn primary", text: "Copy my reply",
        onclick: function () {
          var t = replyText();
          if (!t) return;
          copyText(t).then(function () { toast("Copied. Paste it into your chat."); })
            .catch(function () { toast("Couldn't copy. Select the text and copy it."); });
        } })
    ];
    if (navigator.share) {
      btns.push(el("button", { type: "button", id: "shbtn", class: "btn", text: "Share\u2026",
        onclick: function () {
          var t = replyText();
          if (!t) return;
          navigator.share({ text: t }).catch(function (e) {
            if (e && e.name === "AbortError") return;
            copyText(t).then(function () { toast("Copied. Paste it into your chat."); }).catch(function () { toast("Select the text and copy it."); });
          });
        } }));
    }
    return el("section", { class: "reply" }, [
      el("h2", { text: "Send your answers back" }),
      el("p", { class: "help", text: "Tap an answer on each idea above, then copy your reply and send it in your chat." }),
      ta,
      el("div", { class: "preview empty", id: "rp", "aria-live": "polite" }),
      el("div", { class: "btnrow" }, btns)
    ]);
  }

  function viewGuest() {
    var c = [];
    var conf = state.confirmed ? state.options.filter(function (o) { return o.id === state.confirmed; })[0] : null;
    if (conf) {
      var d = parseDate(conf.date, conf.time);
      var line = d ? d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" }) + (conf.time ? " at " + fmtTime(conf.time) : "") : "";
      var u = untilText(conf);
      c.push(el("header", { class: "hero" }, [
        state.to ? el("p", { class: "hi", text: "Hi " + state.to + "," }) : null,
        el("h1", { text: "It's a date." }),
        el("p", { class: "note", text: line + (u ? " (" + u + ")" : "") })
      ]));
      c.push(ticket(conf, true));
      var url = calUrl(conf);
      if (url) c.push(el("p", { class: "cta" }, [el("a", { class: "btn primary", href: url, target: "_blank", rel: "noopener noreferrer", text: "Add to Google Calendar" })]));
      return c;
    }
    c.push(hero());
    var opts = sorted();
    if (!opts.length) {
      c.push(el("div", { class: "empty-card", text: "No date ideas here yet. Check back soon." }));
      return c;
    }
    c.push(el("ul", { class: "list" }, opts.map(function (o) { return el("li", null, [ticket(o, false)]); })));
    c.push(replyPanel());
    return c;
  }

  function field(label, control) {
    return el("label", { class: "field" }, [el("span", { text: label }), control]);
  }

  function viewEdit() {
    var c = [];
    var ta = el("textarea", { rows: "3", maxlength: "400", placeholder: "Pick what works and I'll book it.", "data-fk": "f-note",
      oninput: function () { state.note = this.value; markDirty(); } });
    ta.value = state.note || "";
    c.push(el("section", { class: "setup" }, [
      field("Her name (optional)", el("input", { type: "text", value: state.to, maxlength: "40", placeholder: "Maya", "data-fk": "f-to",
        oninput: function () { state.to = this.value; markDirty(); } })),
      field("Headline", el("input", { type: "text", value: state.headline, maxlength: "80", placeholder: "Free for a date soon?", "data-fk": "f-headline",
        oninput: function () { state.headline = this.value; markDirty(); } })),
      field("Message to her (optional)", ta)
    ]));

    c.push(el("h2", { text: "Date ideas" }));
    c.push(el("p", { class: "help", text: "Add a few dates and places. She taps an answer on each one." }));

    var conf = state.confirmed ? state.options.filter(function (o) { return o.id === state.confirmed; })[0] : null;
    if (conf) {
      c.push(el("div", { class: "lockednote" }, [
        el("p", { text: "Locked in: " + (conf.title || "Date idea") + ". She now sees a confirmation instead of the options." })
      ]));
    }

    var opts = sorted();
    if (opts.length) c.push(el("ul", { class: "list" }, opts.map(function (o) { return el("li", null, [editTicket(o)]); })));
    else c.push(el("div", { class: "empty-card", text: "No ideas yet. Add your first one below." }));

    c.push(el("button", { type: "button", class: "btn add", "data-fk": "add", text: "Add a date idea", onclick: addOption }));
    return c;
  }

  function topbar() {
    function seg(m, label) {
      return el("button", { type: "button", "aria-pressed": String(mode === m), "data-fk": "seg-" + m, text: label,
        onclick: function () { mode = m; render(); window.scrollTo(0, 0); } });
    }
    return el("div", { class: "top" }, [
      el("div", { class: "seg", role: "group", "aria-label": "Page view" }, [seg("edit", "Edit"), seg("view", "Her view")]),
      el("span", { class: "hint", text: mode === "edit" ? "Build the plan, then copy her link." : "This is what she sees." })
    ]);
  }

  function saveBar() {
    return el("div", { class: "savebar" }, [
      el("p", { id: "savestat", class: "savestat" }),
      el("button", { type: "button", id: "savebtn", class: "btn primary", text: "Copy link for her", onclick: shareLink })
    ]);
  }

  function updateBar() {
    var s = document.getElementById("savestat");
    var b = document.getElementById("savebtn");
    if (!s || !b) return;
    s.textContent = "Your draft saves on this device.";
    b.disabled = !state.options.length;
  }

  function markDirty() { saveDraft(); updateBar(); }

  function render() {
    var a = document.activeElement;
    var fk = pendingFocus || (a && a.getAttribute ? a.getAttribute("data-fk") : null);
    pendingFocus = null;

    var kids = [];
    if (isOwner) {
      kids.push(topbar());
    }
    kids = kids.concat(isOwner && mode === "edit" ? viewEdit() : viewGuest());

    var wrap = el("main", { class: "wrap" + (isOwner ? " owner" : "") }, kids);
    root.replaceChildren(wrap);
    if (isOwner) root.appendChild(saveBar());
    updateBar();
    updateReply();

    if (fk) {
      var n = root.querySelector('[data-fk="' + fk + '"]');
      if (n) n.focus({ preventScroll: false });
    }
  }

  function addOption() {
    var o = { id: uid(), date: iso(nextSaturday()), time: "19:00", title: "", place: "" };
    state.options.push(o);
    markDirty();
    pendingFocus = "f-" + o.id + "-title";
    render();
  }

  /* ---------- share ---------- */
  function validate() {
    for (var i = 0; i < state.options.length; i++) {
      var o = state.options[i];
      o.title = (o.title || "").trim();
      o.place = (o.place || "").trim();
      if (!o.title || !o.date) {
        toast("Every idea needs a title and a date.");
        pendingFocus = "f-" + o.id + "-" + (o.title ? "date" : "title");
        mode = "edit";
        render();
        return false;
      }
    }
    state.to = (state.to || "").trim();
    state.headline = (state.headline || "").trim() || DEFAULT.headline;
    state.note = (state.note || "").trim();
    saveDraft();
    return true;
  }

  function shareLink() {
    if (!state.options.length) { toast("Add at least one date idea first."); return; }
    if (!validate()) return;
    var url = location.href.split("#")[0] + "#d=" + encodePlan(state);
    copyText(url)
      .then(function () { toast("Link copied. Send it to her."); })
      .catch(function () { window.prompt("Copy this link and send it to her:", url); });
  }

  /* ---------- start ---------- */
  function init() {
    var plan = planFromHash();
    if (plan) {
      state = plan;
      isOwner = false;
      mode = "view";
    } else {
      state = loadDraft() || JSON.parse(JSON.stringify(DEFAULT));
      isOwner = true;
      mode = "edit";
    }
    render();
  }

  window.addEventListener("hashchange", init);
  init();
})();
</script>
</body>
</html>
